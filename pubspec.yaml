name: bushra_mobile
description: "Bushra Mobile Banking Application for Somalia."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.30+50 # Android
#version: 1.0.10+30 # IOS

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl_utils: ^2.8.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.1
  pinput: ^5.0.2
  shared_preferences: ^2.5.3
  intl_phone_field: ^3.2.0
  camera: ^0.11.2
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.2.0
  # Direct refs so main.dart can opt into the Android system photo picker.
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.11.0
  local_auth: ^2.3.0
  app_settings: ^6.1.1
  intl: ^0.20.2
  share_plus: ^12.0.0
  qr_code_scanner_plus: ^2.0.10+1
  mobile_scanner: ^7.0.1
  screenshot: ^3.0.0
  barcode: ^2.2.9
  qr_flutter: ^4.1.0
  device_info_plus: ^12.0.0
  flutter_udid: ^4.0.0
  http: ^1.5.0
  dio: ^5.9.0
  fluttertoast: ^8.2.12
  provider: ^6.1.5+1
  uuid: ^4.5.1
  shimmer: ^3.0.0
  connectivity_plus: ^7.0.0
  flutter_svg: ^2.2.1
  crypto: ^3.0.6
  permission_handler: ^12.0.1
  image: ^4.5.4
  pdfx: ^2.9.2
  sqflite: ^2.4.2
  flutter_local_notifications: ^19.4.1
  firebase_messaging: ^16.0.0
  firebase_core: ^4.0.0
  firebase_remote_config: ^6.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  geolocator: ^14.0.2
  flutter_secure_storage: ^9.2.4
  font_awesome_flutter: ^10.8.0
  package_info_plus: ^8.3.0
  #jailbreak_root_detection: ^1.1.6
  jailbreak_root_detection: ^1.2.0+1
  image_gallery_saver_plus: ^4.0.1
  pdf: ^3.11.3


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/launcher_icon/logo-icon.jpg"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  config:
    enable-swift-package-manager: false

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/pdf/
    - assets/certs/
    - assets/icons/
    - assets/images/
    - assets/images/adverts/
    - assets/images/gif/
    - assets/images/icons/
    - assets/images/logo/
    - assets/images/logo/logo.png
    - assets/images/logo/logo.svg
    - assets/images/slider/
    - assets/images/onboarding/
    - assets/images/launcher_icon/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
   - family: Exo2
     fonts:
       - asset: assets/fonts/Exo2-Regular.ttf
       - asset: assets/fonts/Exo2-Medium.ttf
         weight: 500
       - asset: assets/fonts/Exo2-SemiBold.ttf
         weight: 600
       - asset: assets/fonts/Exo2-ExtraBold.ttf
         weight: 800
   - family: Varela
     fonts:
       - asset: assets/fonts/VarelaRound-Regular.ttf
